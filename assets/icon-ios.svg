<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Matte Velvet Dark Canvas (Old Money Obsidian) -->
    <linearGradient id="bgMatte" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16191E"/>
      <stop offset="60%" stop-color="#0D0F12"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>

    <!-- Satin Silk Champagne Gold (Pure Modern Classic) -->
    <linearGradient id="satinGold" x1="280" y1="200" x2="744" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7EEDF"/>
      <stop offset="35%" stop-color="#E5D6BD"/>
      <stop offset="70%" stop-color="#CBB794"/>
      <stop offset="100%" stop-color="#A89470"/>
    </linearGradient>

    <!-- Soft Pearl Gradient -->
    <linearGradient id="pearlGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF3E8"/>
      <stop offset="100%" stop-color="#D6C4A6"/>
    </linearGradient>

    <!-- Subtle Ambient Core Glow (Non-flashy, Warm & Gentle) -->
    <radialGradient id="gentleAura" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#D6C4A6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1024" height="1024" fill="#07080A"/>
  
  <!-- Outer Rounded Squircle with Refined Double Hairline -->
  <rect x="36" y="36" width="952" height="952" rx="240" fill="url(#bgMatte)"/>
  <rect x="36" y="36" width="952" height="952" rx="240" stroke="#E5D6BD" stroke-width="1.2" stroke-opacity="0.28"/>
  <rect x="50" y="50" width="924" height="924" rx="226" stroke="#E5D6BD" stroke-width="0.6" stroke-opacity="0.08"/>

  <!-- Soft Ambient Glow -->
  <circle cx="512" cy="490" r="380" fill="url(#gentleAura)"/>

  <!-- MASTER EMBLEM: Neo-Classic Sovereign Monogram (دمج اسم ثري + الفلسفة المالية + الكلاسيكي الحديث) -->
  <g>
    <!-- 1. The 3 Architectural Pearls of "ث" & Crown of Wealth (نقاط الاسم كتيجان لؤلؤية متناسقة) -->
    <circle cx="512" cy="275" r="38" fill="url(#pearlGrad)"/>
    <circle cx="395" cy="375" r="38" fill="url(#pearlGrad)"/>
    <circle cx="629" cy="375" r="38" fill="url(#pearlGrad)"/>

    <!-- 2. Central Financial Pillar of "T" / Stature of Wealth (عمود الاستقرار والنمو المالي) -->
    <!-- Architectural tapered column that flows seamlessly into the base -->
    <path 
      d="M494 370 H530 C533 370, 535 372, 535 375 V660 C535 663, 533 665, 530 665 H494 C491 665, 489 663, 489 660 V375 C489 372, 491 370, 494 370 Z" 
      fill="url(#satinGold)" 
      opacity="0.9"
    />

    <!-- 3. Neo-Classic Architectural Vault Arch (القوس المالي الكلاسيكي - يمثل حرف الثاء واحتواء الثروة) -->
    <path 
      d="M260 480 C260 625, 372 742, 512 742 C652 742, 764 625, 764 480 C764 465, 745 458, 735 470 C702 508, 620 540, 512 540 C404 540, 322 508, 289 470 C279 458, 260 465, 260 480 Z" 
      fill="url(#satinGold)" 
      opacity="0.18"
    />

    <!-- Dynamic Continuous Silk Contour Line (الخط الكلاسيكي الحديث المنساب) -->
    <path 
      d="M740 470 C745 590, 650 710, 512 710 C374 710, 279 590, 284 470 C286 450, 312 445, 324 462 C356 508, 424 550, 512 550 C600 550, 668 508, 700 462 C712 445, 738 450, 740 470 Z" 
      fill="url(#satinGold)"
    />

    <!-- 4. Subtle Interlocking Balance Ring (حلقة الاتزان المالي الكلاسيكية الرقيقة) -->
    <circle cx="512" cy="512" r="160" stroke="url(#satinGold)" stroke-width="1.8" stroke-dasharray="3 5" opacity="0.35"/>

    <!-- 5. Horizontal Base Plinth / Foundation (قاعدة الأمان المالي الرصينة) -->
    <rect x="424" y="690" width="176" height="6" rx="3" fill="url(#satinGold)" opacity="0.6"/>
  </g>
</svg>
